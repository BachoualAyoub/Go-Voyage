spring.application.name=govoyage
spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:govoyage}
spring.datasource.username=${DB_USER:govoyage}
spring.datasource.password=${DB_PASSWORD:govoyage}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}

springdoc.swagger-ui.path=/swagger-ui.html

go-voyage.jeton.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
go-voyage.jeton.duree-secondes=86400
go-voyage.cors.origines=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
