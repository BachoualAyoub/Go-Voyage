# GO Voyage API : configuration locale.
# Permet de lancer le backend avec le bouton Run (VS Code, IntelliJ) ou mvnw spring-boot:run,
# sans variable d'environnement. Chaque valeur reste surchargeable par une variable.

spring.application.name=govoyage
spring.profiles.active=dev

# Base PostgreSQL locale (serveur demarre depuis pgAdmin ou le service Windows).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:govoyage}
spring.datasource.username=${DB_USER:govoyage}
spring.datasource.password=${DB_PASSWORD:govoyage}

# Flyway cree le schema ; Hibernate le verifie sans le modifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Ecoute sur toutes les interfaces : le telephone du meme Wi-Fi peut joindre l'API.
server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:0.0.0.0}

springdoc.swagger-ui.path=/swagger-ui.html

# Jeton JWT : secret aleatoire a chaque demarrage si JWT_SECRET n'est pas fourni.
go-voyage.jeton.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
go-voyage.jeton.duree-secondes=86400
go-voyage.cors.origines=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
