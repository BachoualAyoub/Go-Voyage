# Base de donnees PostgreSQL 16 de la plateforme GO Voyage
services:
  db:
    image: postgres:16
    container_name: govoyage-db
    environment:
      POSTGRES_DB: govoyage
      POSTGRES_USER: govoyage
      POSTGRES_PASSWORD: govoyage
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govoyage -d govoyage"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - govoyage_data:/var/lib/postgresql/data

volumes:
  govoyage_data:
